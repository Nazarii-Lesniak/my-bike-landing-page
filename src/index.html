<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The official website of My Bike">
    <title>My Bike</title>
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="/src/images/favicon/favicon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="40x40"
      href="/src/images/favicon/favicon-40x40.png"
    />
    <link
      rel="preload"
      href="/src/fonts/Poppins-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/styles/main.scss" />
    <script src="/src/scripts/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__content">
          <div class="top-bar">
            <a href="#top" class="top-bar__logo-link">
              <img
                src="./images/logo-white.svg"
                alt="My Bike logo"
                class="top-bar__logo"
              />
            </a>

            <div class="top-bar__icons">
              <div class="icon icon--phone">
                <a href="tel:+12345555555" class="icon__phone-number">
                  +1 234 555-55-55
                </a>
                <a href="tel:+12345555555" class="icon__link"></a>
              </div>

              <a href="#menu" class="icon icon--menu"></a>
            </div>
          </div>
          <div class="header__bottom">
            <h1 class="header__title">Take the Streets</h1>
          </div>
        </div>
      </div>
    </header>

    <aside class="page__menu menu" id="menu">
      <div class="container">
        <div class="menu__top">
          <div class="top-bar">
            <a href="#top" class="top-bar__logo-link">
              <img
                src="./images/logo-black.svg"
                alt="My Bike logo"
                class="top-bar__logo"
              />
            </a>
            <a href="#" class="icon icon--close menu__top-close"></a>
          </div>
        </div>
        <div class="menu__bottom">
          <nav class="nav menu__nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="#home">Home</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#about-us">About us</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#compare-bikes">Compare Bikes</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#details">Details</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#contacts">Contacts</a>
              </li>
            </ul>
          </nav>
          <a href="tel:+123455555555" class="menu__phone-number">
            +1 234 5555-55-55
          </a>
          <a href="tel:+123455555555" class="menu__call-to-order">
            Book a test ride
          </a>
        </div>
      </div>
    </aside>
  </body>
</html>
